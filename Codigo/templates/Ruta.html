{% import 'macros.jinja2' as macros %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido del Caballo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Ruta del Caballo</h1>
    <button id="btnIniciar" onclick="iniciar()">Iniciar</button>
    
    <div id="contenedor">
        <div id="tablero" class="matriz"></div>
        <p id="contador"></p>
    </div>

    <script>
        var tamaño = {{ Tamaño }};
        var pasos = {{ Ruta|tojson }};

        var tablero = document.getElementById('tablero');

        var matriz = [];
        var fila = 0;
        while (fila < tamaño) {
            matriz.push([]);
            fila = fila + 1;
        }

        function crearTablero() {
            var Filas = 0;
            while (Filas < tamaño) {
                var filaDiv = document.createElement('div');
                filaDiv.className = 'fila';

                var Columnas = 0;
                while (Columnas < tamaño) {
                    var celda = document.createElement('div');
                    celda.className = 'celda';
                    filaDiv.appendChild(celda);
                    matriz[Filas].push(celda);
                    Columnas = Columnas + 1;
                }

                tablero.appendChild(filaDiv);
                Filas = Filas + 1;
            }
        }

        crearTablero();

        if (pasos.length) {
            var primero = pasos[0];
            var filaCaballo = primero[0];
            var colCaballo = primero[1];
            matriz[filaCaballo][colCaballo].className = 'celda caballo';
        }
    </script>
</body>
</html>
